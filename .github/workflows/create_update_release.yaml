name: Create and Update Releases
permissions:
  contents: write

# Pattern zips live in shard releases zips-1 .. zips-16 (shard from _scripts/zip-shard.mjs).
# v1.0.0 stays the "latest" release: the AWS Toolkit for VS Code downloads the zips in
# _scripts/legacy-zips.json from releases/latest/download/<name>.zip. While dualWriteV1 in
# _scripts/zip-releases.json is true, every changed zip also goes to v1.0.0 as before.
# The shell logic is in _scripts/zip-release.sh.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      job:
        description: "backfill: upload zips missing from the shards. cleanup: delete stale assets."
        type: choice
        options:
          - backfill
          - cleanup
        required: true
      mapping_file:
        description: "Optional CSV in the repo, rows current_path,new_zip_name. Backfill uploads only these rows, under the new names. Cleanup keeps these names."
        type: string
        default: ""
      max_uploads:
        description: "Stop after this many uploads (backfill) or deletes (cleanup). Re-run to resume."
        type: number
        default: 450
      dry_run:
        description: "Cleanup only: print what would be deleted, delete nothing."
        type: boolean
        default: true

jobs:
  update-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get changed files
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # Only the files changed by this push.
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
            && git fetch --no-tags --depth=1 origin "$BEFORE"; then
            base="$BEFORE"
          else
            echo "::warning::Commit before this push not found; using the previous commit"
            git fetch --no-tags --deepen=1 origin
            base="HEAD~1"
          fi
          git diff --name-only "$base" HEAD > changed_files.txt
          echo "Changed files:"
          cat changed_files.txt

      - name: Identify changed patterns
        run: |
          # Map each changed file to the pattern it belongs to: the nearest
          # ancestor folder containing an example-pattern.json (any depth).
          # Removed patterns are left out. Their zips are not deleted here:
          # a moved pattern can keep its zip name. The cleanup job removes
          # zips that no pattern has.
          : > changed_folders.txt
          if [ -s changed_files.txt ]; then
            while IFS= read -r file; do
              [ -n "$file" ] || continue
              dir=$(dirname "$file")
              while [ "$dir" != "." ] && [ "$dir" != "/" ] && [ ! -f "$dir/example-pattern.json" ]; do
                dir=$(dirname "$dir")
              done
              if [ -f "$dir/example-pattern.json" ]; then
                echo "$dir"
              fi
            done < changed_files.txt | sort -u > changed_folders.txt
          fi
          echo "Changed patterns:"
          cat changed_folders.txt

      - name: Upload zips to shards, v1.0.0 and legacy names
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash _scripts/zip-release.sh push changed_folders.txt

  backfill:
    if: github.event_name == 'workflow_dispatch' && inputs.job == 'backfill'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload missing zips
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAPPING_FILE: ${{ inputs.mapping_file }}
          MAX_UPLOADS: ${{ inputs.max_uploads }}
        run: |
          if [ -n "$MAPPING_FILE" ] && { [[ "$MAPPING_FILE" == *..* ]] || [ ! -f "$MAPPING_FILE" ]; }; then
            echo "::error::mapping_file must be a file in the repo: $MAPPING_FILE"; exit 1
          fi
          bash _scripts/zip-release.sh backfill "$MAPPING_FILE"

  cleanup:
    if: github.event_name == 'workflow_dispatch' && inputs.job == 'cleanup'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Delete stale zips
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAPPING_FILE: ${{ inputs.mapping_file }}
          MAX_UPLOADS: ${{ inputs.max_uploads }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ -n "$MAPPING_FILE" ] && { [[ "$MAPPING_FILE" == *..* ]] || [ ! -f "$MAPPING_FILE" ]; }; then
            echo "::error::mapping_file must be a file in the repo: $MAPPING_FILE"; exit 1
          fi
          bash _scripts/zip-release.sh cleanup "$MAPPING_FILE"
