name: "Schema Validation"
permissions:
  contents: read
on: [pull_request]
jobs:
  validate-pattern:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Get changed files
        id: changed-files
        run: |
          # HEAD is the PR merge commit and HEAD^1 is the main commit it merges into, so the
          # diff holds only the PR's changes even when base.sha is stale.
          # --no-renames reports a moved file as added.
          added=$(git diff --name-only --no-renames --diff-filter=A HEAD^1 HEAD | paste -sd, -)
          modified=$(git diff --name-only --no-renames --diff-filter=M HEAD^1 HEAD | paste -sd, -)
          echo "added_files=$added" >> "$GITHUB_OUTPUT"
          echo "modified_files=$modified" >> "$GITHUB_OUTPUT"
      - run: cd _scripts && npm i
      - name: Validate
        run: node _scripts/validate.js
        env:
          MODIFIED_FILES: ${{ steps.changed-files.outputs.modified_files }}
          ADDED_FILES: ${{ steps.changed-files.outputs.added_files }}
          PR_NUMBER: ${{ github.event.number }}
          GH_AUTOMATION: false
