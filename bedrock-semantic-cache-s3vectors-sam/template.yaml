AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Serverless semantic cache for Amazon Bedrock. A Lambda function embeds each prompt,
  finds semantically-similar prior prompts in Amazon S3 Vectors, and returns the cached
  answer on a hit (skipping the LLM) or calls Amazon Bedrock and caches the result on a miss.
  (bedrock-semantic-cache-s3vectors-sam)

Parameters:
  VectorBucketName:
    Type: String
    Default: semantic-cache
    Description: >
      Name for the S3 Vectors vector bucket created by this template. Must be 3-63
      characters, lowercase letters, numbers and hyphens only, and unique per Region.
  VectorIndex:
    Type: String
    Default: prompt-cache
    Description: Name of the S3 Vectors index created by this template.
  SimThreshold:
    Type: String
    Default: "0.85"
    Description: Cosine-similarity threshold for a cache hit (0-1). Higher = stricter matching.
  TtlSeconds:
    Type: String
    Default: "86400"
    Description: Freshness window in seconds. Entries older than this are treated as a miss.
  ApiKeyParameterName:
    Type: String
    Default: ""
    Description: >
      Optional. Name of an existing AWS Systems Manager Parameter Store SecureString
      parameter (for example /semantic-cache/api-key) holding an app-level key checked
      against the x-api-key header. Leave blank to rely only on IAM auth. The value is
      read at runtime and is never stored in a Lambda environment variable.
  EmbedModel:
    Type: String
    Default: amazon.titan-embed-text-v2:0
    Description: Bedrock embeddings model used for semantic matching (must match the index dimension).
  LlmModel:
    Type: String
    Default: amazon.nova-lite-v1:0
    Description: Bedrock model used to generate the answer on a cache miss.

Conditions:
  HasApiKeyParam: !Not [!Equals [!Ref ApiKeyParameterName, ""]]

Resources:
  # The vector store is created by the template. Amazon S3 Vectors has native
  # CloudFormation support, so no manual CLI setup is required.
  VectorBucket:
    Type: AWS::S3Vectors::VectorBucket
    Properties:
      VectorBucketName: !Ref VectorBucketName

  # Dimension 1024 and cosine match the Titan Text Embeddings V2 model above.
  VectorIndexResource:
    Type: AWS::S3Vectors::Index
    Properties:
      VectorBucketArn: !Ref VectorBucket
      IndexName: !Ref VectorIndex
      DataType: float32
      Dimension: 1024
      DistanceMetric: cosine
      MetadataConfiguration:
        NonFilterableMetadataKeys:
          - prompt
          - response
          - model
          - created_at
          - epoch

  # Global cache epoch for one-call force-invalidation (bump this to invalidate everything).
  CacheEpoch:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/${AWS::StackName}/epoch"
      Type: String
      Value: "1"

  SemanticCacheFunction:
    Type: AWS::Serverless::Function
    DependsOn: VectorIndexResource
    Properties:
      Runtime: python3.13
      Handler: cache.handler
      CodeUri: src/
      Timeout: 60
      MemorySize: 512
      Architectures:
        - arm64
      Environment:
        Variables:
          VECTOR_BUCKET: !Ref VectorBucketName
          VECTOR_INDEX: !Ref VectorIndex
          EMBED_MODEL: !Ref EmbedModel
          LLM_MODEL: !Ref LlmModel
          SIM_THRESHOLD: !Ref SimThreshold
          TTL_SECONDS: !Ref TtlSeconds
          EPOCH_PARAM: !Ref CacheEpoch
          # Only the parameter NAME is passed. The secret value itself is fetched at
          # runtime with decryption, so it never appears in the function configuration.
          API_KEY_PARAM: !Ref ApiKeyParameterName
      FunctionUrlConfig:
        AuthType: AWS_IAM
      Policies:
        - Statement:
            - Sid: BedrockInvoke
              Effect: Allow
              Action: bedrock:InvokeModel
              Resource: "arn:aws:bedrock:*::foundation-model/*"
            # Only the three actions cache.py actually calls. GetVectors is required
            # because query_vectors is called with returnMetadata=True.
            - Sid: S3Vectors
              Effect: Allow
              Action:
                - s3vectors:QueryVectors
                - s3vectors:GetVectors
                - s3vectors:PutVectors
              Resource:
                - !Sub "arn:aws:s3vectors:${AWS::Region}:${AWS::AccountId}:bucket/${VectorBucketName}"
                - !Sub "arn:aws:s3vectors:${AWS::Region}:${AWS::AccountId}:bucket/${VectorBucketName}/index/*"
            - Sid: EpochParam
              Effect: Allow
              Action:
                - ssm:GetParameter
                - ssm:PutParameter
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AWS::StackName}/epoch"
            - !If
              - HasApiKeyParam
              - Sid: ReadApiKeyParameter
                Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ApiKeyParameterName}"
              - !Ref AWS::NoValue
            - !If
              - HasApiKeyParam
              - Sid: DecryptApiKeyParameter
                Effect: Allow
                Action: kms:Decrypt
                Resource: "*"
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub "ssm.${AWS::Region}.amazonaws.com"
              - !Ref AWS::NoValue

Outputs:
  FunctionUrl:
    Description: IAM-signed HTTPS endpoint of the semantic cache.
    Value: !GetAtt SemanticCacheFunctionUrl.FunctionUrl
  FunctionName:
    Description: Lambda function name (for aws lambda invoke testing).
    Value: !Ref SemanticCacheFunction
  VectorBucketArn:
    Description: ARN of the S3 Vectors vector bucket created by this template.
    Value: !Ref VectorBucket
  VectorIndexArn:
    Description: ARN of the S3 Vectors index created by this template.
    Value: !Ref VectorIndexResource
