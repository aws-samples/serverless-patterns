AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Serverless semantic cache for Amazon Bedrock. An AWS Lambda function embeds each prompt,
  finds semantically similar prior prompts in Amazon S3 Vectors, and returns the cached
  answer on a hit (skipping the large language model) or calls Amazon Bedrock and caches
  the result on a miss.
  (bedrock-semantic-cache-s3vectors-sam)

Parameters:
  VectorBucketName:
    Type: String
    MinLength: 3
    MaxLength: 63
    AllowedPattern: "^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$"
    Description: >
      Name for the Amazon S3 Vectors vector bucket created by this template. Lowercase
      letters, numbers and hyphens only. The name must be unique in your AWS account for
      the Region, so there is no default: pick one that is free, for example
      my-semantic-cache-01.
  VectorIndex:
    Type: String
    Default: prompt-cache
    Description: Name of the Amazon S3 Vectors index created by this template inside the vector bucket.
  SimThreshold:
    Type: String
    Default: "0.85"
    Description: Cosine similarity threshold for a cache hit (0 to 1). Higher means stricter matching.
  TtlSeconds:
    Type: String
    Default: "86400"
    Description: Freshness window in seconds. Entries older than this are treated as a miss.
  ApiKeyParameterName:
    Type: String
    Default: ""
    AllowedPattern: "^$|^/[a-zA-Z0-9_./-]+$"
    Description: >
      Optional. Name of an existing AWS Systems Manager Parameter Store SecureString
      parameter (for example /semantic-cache/api-key) holding an application level key
      checked against the x-api-key header. Must start with a forward slash. Leave blank
      to rely only on AWS Identity and Access Management (IAM) auth. The value is read at
      runtime and is never stored in a Lambda environment variable.
  EmbedModel:
    Type: String
    Default: amazon.titan-embed-text-v2:0
    Description: Amazon Bedrock embeddings model used for semantic matching (must match the index dimension).
  LlmModel:
    Type: String
    Default: amazon.nova-lite-v1:0
    Description: Amazon Bedrock model used to generate the answer on a cache miss.

Conditions:
  HasApiKeyParam: !Not [!Equals [!Ref ApiKeyParameterName, ""]]

Resources:
  # The vector store is created by the template. Amazon S3 Vectors has native
  # CloudFormation support, so no manual CLI setup is required.
  VectorBucket:
    Type: AWS::S3Vectors::VectorBucket
    Properties:
      VectorBucketName: !Ref VectorBucketName

  # Dimension 1024 and cosine match the default output vector size of the Amazon Titan
  # Text Embeddings V2 model used above.
  # https://docs.aws.amazon.com/bedrock/latest/userguide/titan-embedding-models.html
  VectorIndexResource:
    Type: AWS::S3Vectors::Index
    Properties:
      VectorBucketArn: !GetAtt VectorBucket.VectorBucketArn
      IndexName: !Ref VectorIndex
      DataType: float32
      Dimension: 1024
      DistanceMetric: cosine
      # Non-filterable keys are not indexed for filtering, which keeps the cached answer
      # out of the 2 KB filterable metadata budget. Total metadata stays capped at 40 KB.
      # https://docs.aws.amazon.com/AmazonS3/latest/userguide/s3-vectors-limitations.html
      MetadataConfiguration:
        NonFilterableMetadataKeys:
          - prompt
          - response
          - model
          - created_at
          - epoch

  # Global cache epoch for one call force invalidation (bump this to invalidate everything).
  CacheEpoch:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/${AWS::StackName}/epoch"
      Type: String
      Value: "1"

  # Owned by the stack (rather than created implicitly by Lambda on first invoke) so that
  # deleting the stack also deletes the logs and nothing is left behind.
  SemanticCacheLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 7

  SemanticCacheFunction:
    Type: AWS::Serverless::Function
    DependsOn: VectorIndexResource
    Properties:
      Runtime: python3.13
      Handler: cache.handler
      CodeUri: src/
      Timeout: 60
      MemorySize: 512
      Architectures:
        - arm64
      LoggingConfig:
        LogGroup: !Ref SemanticCacheLogGroup
      Environment:
        Variables:
          VECTOR_BUCKET: !Ref VectorBucketName
          VECTOR_INDEX: !Ref VectorIndex
          EMBED_MODEL: !Ref EmbedModel
          LLM_MODEL: !Ref LlmModel
          SIM_THRESHOLD: !Ref SimThreshold
          TTL_SECONDS: !Ref TtlSeconds
          EPOCH_PARAM: !Ref CacheEpoch
          # Only the parameter NAME is passed. The secret value itself is fetched at
          # runtime with decryption, so it never appears in the function configuration.
          API_KEY_PARAM: !Ref ApiKeyParameterName
      FunctionUrlConfig:
        AuthType: AWS_IAM
      Policies:
        - Statement:
            # Foundation models are account-less ARNs and the model id is a deploy time
            # parameter, so the wildcard covers the embeddings model and the answer model
            # without listing both. This is the scope AWS documents for InvokeModel.
            # https://docs.aws.amazon.com/bedrock/latest/userguide/security_iam_id-based-policy-examples.html
            - Sid: BedrockInvoke
              Effect: Allow
              Action: bedrock:InvokeModel
              Resource: !Sub "arn:${AWS::Partition}:bedrock:*::foundation-model/*"
            # Only the three actions cache.py actually calls. GetVectors is required
            # because QueryVectors is called with returnMetadata set to true.
            # https://docs.aws.amazon.com/AmazonS3/latest/API/API_S3VectorBuckets_QueryVectors.html
            - Sid: S3Vectors
              Effect: Allow
              Action:
                - s3vectors:QueryVectors
                - s3vectors:GetVectors
                - s3vectors:PutVectors
              Resource:
                - !GetAtt VectorBucket.VectorBucketArn
                - !Sub "${VectorBucket.VectorBucketArn}/index/*"
            # Scoped to the single epoch parameter this stack owns. PutParameter is needed
            # because the invalidate action bumps the epoch value.
            - Sid: EpochParam
              Effect: Allow
              Action:
                - ssm:GetParameter
                - ssm:PutParameter
              Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AWS::StackName}/epoch"
            - !If
              - HasApiKeyParam
              # Read only, and only the one parameter whose name the deployer supplied.
              - Sid: ReadApiKeyParameter
                Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ApiKeyParameterName}"
              - !Ref AWS::NoValue
            - !If
              - HasApiKeyParam
              # A SecureString is decrypted with the AWS managed key for AWS Systems
              # Manager, whose ARN is not known at deploy time, so the resource cannot be
              # named. The kms:ViaService condition narrows this to decrypt calls that
              # Parameter Store makes in this Region on the function's behalf.
              # https://docs.aws.amazon.com/kms/latest/developerguide/conditions-kms.html
              - Sid: DecryptApiKeyParameter
                Effect: Allow
                Action: kms:Decrypt
                Resource: "*"
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub "ssm.${AWS::Region}.amazonaws.com"
              - !Ref AWS::NoValue

Outputs:
  FunctionUrl:
    Description: IAM signed HTTPS endpoint of the semantic cache.
    Value: !GetAtt SemanticCacheFunctionUrl.FunctionUrl
  FunctionName:
    Description: Lambda function name (used by the aws lambda invoke commands in Testing).
    Value: !Ref SemanticCacheFunction
  LogGroupName:
    Description: CloudWatch Logs log group that the function writes to.
    Value: !Ref SemanticCacheLogGroup
  VectorBucketArn:
    Description: ARN of the Amazon S3 Vectors vector bucket created by this template.
    Value: !GetAtt VectorBucket.VectorBucketArn
  VectorIndexArn:
    Description: ARN of the Amazon S3 Vectors index created by this template.
    Value: !GetAtt VectorIndexResource.IndexArn
