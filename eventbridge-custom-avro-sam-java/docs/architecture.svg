  <text x="30" y="40" class="title">Avro on an EventBridge custom event bus (eventsv2)</text>
  <text x="30" y="62" class="sub">Publisher Avro-encodes + Glue-frames the event; EventBridge decodes it against the Glue registry and delivers JSON to a Lambda.</text>

