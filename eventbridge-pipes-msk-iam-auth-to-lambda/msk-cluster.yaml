AWSTemplateFormatVersion: '2010-09-09'
Parameters:
  MSKKafkaVersion:
    Type: String
    Default: 4.1.x.kraft
    AllowedValues:
    - 4.1.x.kraft
    - 4.0.x.kraft
    - 3.9.x.kraft
    - 3.9.x
    - 3.8.x.kraft
    - 3.8.x
  InstanceType:
    Type: String
    Default: kafka.m5.large
    AllowedValues:
    - kafka.t3.small
    - kafka.m5.large
    - kafka.m5.xlarge
    - kafka.m5.2xlarge
    - kafka.m5.4xlarge
    - kafka.m5.8xlarge
    - kafka.m5.12xlarge
    - kafka.m5.16xlarge
    - kafka.m5.24xlarge
  VPCId:
    Type: String
    Description: 'The VPC ID'
  PublicSubnetOne:
    Type: String
    Description: 'Public Subnet'
  PrivateSubnetMSKOne:
    Type: String
    Description: 'Private Subnet One'
  PrivateSubnetMSKTwo:
    Type: String
    Description: 'Private Subnet Two'
  
Resources:
  KafkaClientInstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Kafka client instance. No inbound rules; connect with Session Manager.
      GroupName: !Sub "${AWS::StackName} Security group attached to the kafka client producer"
      VpcId: !Ref VPCId
  
  MSKSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:         
      GroupName: !Sub "${AWS::StackName} Security group for the MSK cluster"
      GroupDescription: Security Group for the MSK cluster
      VpcId: !Ref VPCId
      SecurityGroupIngress:
      - Description: Kafka client, IAM auth
        FromPort: 9098
        ToPort: 9098
        IpProtocol: tcp
        SourceSecurityGroupId: !GetAtt KafkaClientInstanceSecurityGroup.GroupId

  MSKSecurityGroup9094:
    Type: AWS::EC2::SecurityGroupIngress
    DependsOn: MSKSecurityGroup
    Properties:
      GroupId: !GetAtt MSKSecurityGroup.GroupId
      Description: Enable Self referencing Bootstrap servers TLS
      IpProtocol: tcp
      FromPort: 9094
      ToPort: 9094
      SourceSecurityGroupId: !GetAtt MSKSecurityGroup.GroupId

  MSKSecurityGroup9092:
    Type: AWS::EC2::SecurityGroupIngress
    DependsOn: MSKSecurityGroup
    Properties:
      GroupId: !GetAtt MSKSecurityGroup.GroupId
      Description: Enable Self referencing Bootstrap servers Plaintext
      IpProtocol: tcp
      FromPort: 9092
      ToPort: 9092
      SourceSecurityGroupId: !GetAtt MSKSecurityGroup.GroupId

  MSKSecurityGroup9096:
    Type: AWS::EC2::SecurityGroupIngress
    DependsOn: MSKSecurityGroup
    Properties:
      GroupId: !GetAtt MSKSecurityGroup.GroupId
      Description: Enable Self referencing SASL
      IpProtocol: tcp
      FromPort: 9096
      ToPort: 9096
      SourceSecurityGroupId: !GetAtt MSKSecurityGroup.GroupId

  MSKSecurityGroup9098:
    Type: AWS::EC2::SecurityGroupIngress
    DependsOn: MSKSecurityGroup
    Properties:
      GroupId: !GetAtt MSKSecurityGroup.GroupId
      Description: Enable Self referencing IAM
      IpProtocol: tcp
      FromPort: 9098
      ToPort: 9098
      SourceSecurityGroupId: !GetAtt MSKSecurityGroup.GroupId

  MSKCluster:
    Type: AWS::MSK::Cluster
    Properties: 
      BrokerNodeGroupInfo: 
        ClientSubnets:
          - !Ref PrivateSubnetMSKOne
          - !Ref PrivateSubnetMSKTwo
        SecurityGroups:
          - !GetAtt MSKSecurityGroup.GroupId
        InstanceType: !Ref InstanceType
        StorageInfo:
          EBSStorageInfo:
            VolumeSize: 500
      ClusterName: !Sub "${AWS::StackName}-cluster"
      ClientAuthentication:
          Sasl:
            Iam:
              Enabled: True
      KafkaVersion: !Ref MSKKafkaVersion
      NumberOfBrokerNodes: 2
      EncryptionInfo: 
        EncryptionInTransit: 
          InCluster: true

Outputs:
  MSKCluster: 
    Description: MSK Cluster details
    Value: !Ref MSKCluster
  ClusterName:
    Description: MSK Cluster Name
    Value: !Select [ 1, !Split ["/", !Ref MSKCluster]]
  ClusterId:
    Description: MSK Cluster Id
    Value: !Select [ 2, !Split ["/", !Ref MSKCluster]]
  KafkaClientInstanceSecurityGroupID:
    Description: Kafka client SG ID
    Value: !GetAtt KafkaClientInstanceSecurityGroup.GroupId

