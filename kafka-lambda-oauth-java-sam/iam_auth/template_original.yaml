AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Lambda function that consumes from Amazon MSK, IAM authentication (IAM_AUTH).
  The client EC2 instance writes template.yaml from this file, filling the
  placeholders with this environment's values.

# More info about Globals: https://github.com/awslabs/serverless-application-model/blob/master/docs/globals.rst
Globals:
  Function:
    Timeout: 15

Resources:
  LambdaKafkaConsumerJavaFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: kafka_event_consumer_function
      Handler: com.amazonaws.services.lambda.samples.events.msk.HandlerMSK::handleRequest
      Runtime: JAVA_VERSION
      Architectures:
        - x86_64
      MemorySize: 512
      Environment: # More info about Env Vars: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#environment-object
        Variables:
          # The consumer writes each message's fields + Kafka metadata to this table
          DYNAMODB_TABLE_NAME: !Ref DynamoDBTableName
          JAVA_TOOL_OPTIONS: -XX:+TieredCompilation -XX:TieredStopAtLevel=1 # More info about tiered compilation https://aws.amazon.com/blogs/compute/optimizing-aws-lambda-function-performance-for-java/
      Events:
        SelfManagedKafkaEvent:
          Type: SelfManagedKafka # More info about SelfManagedKafka Event https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/sam-property-function-selfmanagedkafka.html
          Properties:
            StartingPosition: TRIM_HORIZON
            BatchSize: 10
            ConsumerGroupId: !Ref ConsumerGroupId
            # Provisioned mode: one poller is plenty for this sample.
            ProvisionedPollerConfig:
              MinimumPollers: 1
              MaximumPollers: 1
            Topics:
              - !Ref KafkaTopic
            KafkaBootstrapServers:
              - !Ref KafkaBootstrapServer1
              - !Ref KafkaBootstrapServer2
              - !Ref KafkaBootstrapServer3
            SourceAccessConfigurations:
              # The brokers live on private IPs inside the VPC, so the event source
              # mapping attaches ENIs to these subnets to reach them.
              - Type: VPC_SUBNET
                URI: !Sub "subnet:${PrivateSubnetOne}"
              - Type: VPC_SUBNET
                URI: !Sub "subnet:${PrivateSubnetTwo}"
              - Type: VPC_SUBNET
                URI: !Sub "subnet:${PrivateSubnetThree}"
              - Type: VPC_SECURITY_GROUP
                URI: !Sub "security_group:${SecurityGroupId}"
              # IAM authentication (SASL/AWS_MSK_IAM). No URI: Lambda signs each
              # connection with this function's execution role.
              - Type: IAM_AUTH
      Policies:
      - DynamoDBWritePolicy:
          TableName: !Ref MessagesTable
      # SAM adds the ENI permissions for the VPC entries, but no cluster
      # permissions for IAM_AUTH. Joining a consumer group counts as altering it,
      # hence AlterGroup for a read-only consumer.
      - Statement:
        - Sid: MSKClusterAccess
          Effect: Allow
          Action:
          - kafka-cluster:Connect
          - kafka-cluster:DescribeCluster
          Resource: !Sub "arn:${AWS::Partition}:kafka:${AWS::Region}:${AWS::AccountId}:cluster/${MSKClusterName}/*"
        - Sid: MSKTopicRead
          Effect: Allow
          Action:
          - kafka-cluster:DescribeTopic
          - kafka-cluster:ReadData
          Resource: !Sub "arn:${AWS::Partition}:kafka:${AWS::Region}:${AWS::AccountId}:topic/${MSKClusterName}/*"
        - Sid: MSKGroupAccess
          Effect: Allow
          Action:
          - kafka-cluster:AlterGroup
          - kafka-cluster:DescribeGroup
          Resource: !Sub "arn:${AWS::Partition}:kafka:${AWS::Region}:${AWS::AccountId}:group/${MSKClusterName}/*"

  MessagesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref DynamoDBTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: topicPartition
          AttributeType: S
        - AttributeName: offset
          AttributeType: N
      KeySchema:
        - AttributeName: topicPartition
          KeyType: HASH
        - AttributeName: offset
          KeyType: RANGE
Parameters:
  KafkaTopic:
    Type: String
    Description: Enter the name of the Kafka Topic the Lambda function will consume from
    Default: KAFKA_TOPIC
  KafkaBootstrapServer1:
    Type: String
    Description: First MSK broker bootstrap endpoint (host:port, IAM :9098)
    Default: BOOTSTRAP_SERVER_1
  KafkaBootstrapServer2:
    Type: String
    Description: Second MSK broker bootstrap endpoint (host:port, IAM :9098)
    Default: BOOTSTRAP_SERVER_2
  KafkaBootstrapServer3:
    Type: String
    Description: Third MSK broker bootstrap endpoint (host:port, IAM :9098)
    Default: BOOTSTRAP_SERVER_3
  PrivateSubnetOne:
    Type: String
    Description: First private subnet ID for the Lambda event source mapping ENIs
    Default: SUBNET_1
  PrivateSubnetTwo:
    Type: String
    Description: Second private subnet ID for the Lambda event source mapping ENIs
    Default: SUBNET_2
  PrivateSubnetThree:
    Type: String
    Description: Third private subnet ID for the Lambda event source mapping ENIs
    Default: SUBNET_3
  SecurityGroupId:
    Type: String
    Description: Security group ID for the Lambda event source mapping ENIs
    Default: LAMBDA_SG
  DynamoDBTableName:
    Type: String
    Description: >
      DynamoDB table the consumer writes to. A parameter rather than a !Ref to the
      table so that `sam local invoke` sees the real name too.
    Default: MESSAGES_TABLE_NAME
  ConsumerGroupId:
    Type: String
    Description: Kafka consumer group the event source mapping joins
    Default: lambda-iam-consumer
  MSKClusterName:
    Type: String
    Description: Name of the MSK cluster, used to scope the kafka-cluster IAM permissions
    Default: MSK_CLUSTER_NAME
Outputs:
  LambdaKafkaConsumerJavaFunction:
    Description: "Kafka consumer Lambda function ARN"
    Value: !GetAtt LambdaKafkaConsumerJavaFunction.Arn
  MessagesTableName:
    Description: "DynamoDB table the consumer writes to"
    Value: !Ref MessagesTable
