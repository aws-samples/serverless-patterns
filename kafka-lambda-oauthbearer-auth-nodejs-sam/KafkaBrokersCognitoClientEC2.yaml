AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Creates a self-managed Apache Kafka cluster (3 brokers on 3 EC2 instances, KRaft mode)
  configured for SASL/OAUTHBEARER authentication against an Amazon Cognito User Pool,
  plus a 4th "client" EC2 instance pre-loaded with Java, Node.js, Docker, the AWS CLI and
  the AWS SAM CLI so that the accompanying Lambda pattern can be built, deployed and tested.

Parameters:
  AdminUsername:
    Type: String
    Description: Cognito username for the Kafka ADMIN client (super user - may create topics and manage ACLs).
    Default: kafka-admin
    MinLength: 1
  ProducerUsername:
    Type: String
    Description: Cognito username for the Kafka PRODUCER client (authorized to WRITE to topics only).
    Default: kafka-producer
    MinLength: 1
  ConsumerUsername:
    Type: String
    Description: Cognito username for the Kafka CONSUMER client (authorized to READ from topics only).
    Default: kafka-consumer
    MinLength: 1
  LatestAmiId:
    Type: 'AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>'
    Default: '/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-6.1-x86_64'
  JavaVersion:
    Type: String
    Description: Amazon Corretto (Java) version installed on the EC2 Kafka brokers and client to run Apache Kafka and its CLI tools. This does NOT set the Lambda runtime - the Lambda consumer uses the Node.js runtime defined in the SAM template / deploy script.
    AllowedValues:
      - java11
      - java17
      - java21
      - java25
    Default: java21
  NodeVersion:
    Type: String
    Description: Node.js runtime for the Lambda consumer. The client instance's UserData substitutes this into the SAM template (template.yaml) in place of the NODE_VERSION placeholder.
    AllowedValues:
      - nodejs20.x
      - nodejs22.x
      - nodejs24.x
    Default: nodejs22.x
  ApacheKafkaInstallerLocation:
    Type: String
    Description: Download URL for the Apache Kafka distribution (Scala 2.13 build).
    Default: https://archive.apache.org/dist/kafka/3.9.0/kafka_2.13-3.9.0.tgz
  StrimziOAuthVersion:
    Type: String
    Description: Version of the Strimzi kafka-oauth libraries used for SASL/OAUTHBEARER on the brokers and client.
    Default: 0.15.0
  NimbusJoseJwtVersion:
    Type: String
    Description: Version of the nimbus-jose-jwt library (transitive dependency of the Strimzi OAuth libraries).
    Default: 9.37.3
  KafkaClusterId:
    Type: String
    Description: >
      Shared KRaft cluster ID (base64-encoded UUID). Must be identical on all three brokers.
      Generate your own with 'kafka-storage.sh random-uuid' or keep the default.
    Default: 4L6g3nShT-eMCtK--X86sw
  KafkaTopicForLambda:
    Type: String
    Default: KafkaOAuthBearerLambdaTopic
  ServerlessLandGithubLocation:
    Type: String
    Default: https://github.com/aws-samples/serverless-patterns/
    Description: Git URL of the serverless-patterns repository (or your fork) that the client instance clones. URL only - put the branch in ServerlessLandGithubBranch.
  ServerlessLandGithubBranch:
    Type: String
    Default: main
    AllowedPattern: '^[A-Za-z0-9._/-]+$'
    Description: Branch of ServerlessLandGithubLocation to clone, for example main or a feature branch in your fork.

Mappings:
  SubnetConfig:
    VPC:
      CIDR: '10.0.0.0/16'
    PublicOne:
      CIDR: '10.0.0.0/24'
    PrivateSubnetOne:
      CIDR: '10.0.1.0/24'
    PrivateSubnetTwo:
      CIDR: '10.0.2.0/24'
    PrivateSubnetThree:
      CIDR: '10.0.3.0/24'
  BrokerConfig:
    Broker1:
      PrivateIp: '10.0.1.10'
      NodeId: '1'
    Broker2:
      PrivateIp: '10.0.2.10'
      NodeId: '2'
    Broker3:
      PrivateIp: '10.0.3.10'
      NodeId: '3'

Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      EnableDnsSupport: true
      EnableDnsHostnames: true
      CidrBlock: !FindInMap ['SubnetConfig', 'VPC', 'CIDR']
      Tags:
        - Key: 'Name'
          Value: 'KafkaOAuthVPC'

  PublicSubnetOne:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone:
        Fn::Select:
          - 0
          - Fn::GetAZs: {Ref: 'AWS::Region'}
      VpcId: !Ref 'VPC'
      CidrBlock: !FindInMap ['SubnetConfig', 'PublicOne', 'CIDR']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: 'Name'
          Value: 'PublicSubnet'
  PrivateSubnetOne:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone:
        Fn::Select:
          - 0
          - Fn::GetAZs: {Ref: 'AWS::Region'}
      VpcId: !Ref 'VPC'
      CidrBlock: !FindInMap ['SubnetConfig', 'PrivateSubnetOne', 'CIDR']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: 'Name'
          Value: 'PrivateSubnetOne'
  PrivateSubnetTwo:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone:
        Fn::Select:
          - 1
          - Fn::GetAZs: {Ref: 'AWS::Region'}
      VpcId: !Ref 'VPC'
      CidrBlock: !FindInMap ['SubnetConfig', 'PrivateSubnetTwo', 'CIDR']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: 'Name'
          Value: 'PrivateSubnetTwo'
  PrivateSubnetThree:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone:
        Fn::Select:
          - 2
          - Fn::GetAZs: {Ref: 'AWS::Region'}
      VpcId: !Ref 'VPC'
      CidrBlock: !FindInMap ['SubnetConfig', 'PrivateSubnetThree', 'CIDR']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: 'Name'
          Value: 'PrivateSubnetThree'

  InternetGateway:
    Type: AWS::EC2::InternetGateway
  GatewayAttachement:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref 'VPC'
      InternetGatewayId: !Ref 'InternetGateway'

  NATEIP:
    Type: AWS::EC2::EIP
    DependsOn: GatewayAttachement
    Properties:
      Domain: vpc

  NATGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NATEIP.AllocationId
      SubnetId: !Ref 'PublicSubnetOne'
      Tags:
        - Key: 'Name'
          Value: 'KafkaOAuthNATGateway'

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref 'VPC'
  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachement
    Properties:
      RouteTableId: !Ref 'PublicRouteTable'
      DestinationCidrBlock: '0.0.0.0/0'
      GatewayId: !Ref 'InternetGateway'
  PublicSubnetOneRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetOne
      RouteTableId: !Ref PublicRouteTable

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref 'VPC'
  PrivateRoute:
    Type: AWS::EC2::Route
    DependsOn: NATGateway
    Properties:
      RouteTableId: !Ref 'PrivateRouteTable'
      DestinationCidrBlock: '0.0.0.0/0'
      NatGatewayId: !Ref 'NATGateway'
  PrivateSubnetOneRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateSubnetOne
  PrivateSubnetTwoRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateSubnetTwo
  PrivateSubnetThreeRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateSubnetThree

  # ---- Cognito User Pool used as the OAuth 2.0 identity provider ----
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-kafka-oauth-pool"
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "${AWS::StackName}-kafka-client"
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AccessTokenValidity: 1
      TokenValidityUnits:
        AccessToken: hours

  # Hosted-UI domain, resource server + scope, and a machine-to-machine app
  # client (client_credentials grant) used by the AWS Lambda self-managed Kafka
  # event source poller to mint OAuth tokens.
  CognitoUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref CognitoUserPool
      Domain: !Sub "${AWS::StackName}-${AWS::AccountId}"

  CognitoResourceServer:
    Type: AWS::Cognito::UserPoolResourceServer
    Properties:
      UserPoolId: !Ref CognitoUserPool
      Identifier: kafka
      Name: kafka
      Scopes:
        - ScopeName: consume
          ScopeDescription: Consume Kafka messages

  CognitoPollerClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: CognitoResourceServer
    Properties:
      ClientName: !Sub "${AWS::StackName}-kafka-poller"
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: true
      AllowedOAuthFlows:
        - client_credentials
      AllowedOAuthScopes:
        - kafka/consume
      AllowedOAuthFlowsUserPoolClient: true
      SupportedIdentityProviders:
        - COGNITO

  # ---- Generated passwords for the three role users (kept in Secrets Manager,
  #      never passed as CloudFormation parameters). The template stores a JSON
  #      { "username": ..., "password": ... } for each role. ----
  AdminUserSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${AWS::StackName}-kafka-admin-credentials"
      Description: Cognito credentials for the Kafka admin client
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"username": "${AdminUsername}"}'
        GenerateStringKey: password
        PasswordLength: 20
        RequireEachIncludedType: true
        ExcludePunctuation: true

  ProducerUserSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${AWS::StackName}-kafka-producer-credentials"
      Description: Cognito credentials for the Kafka producer client
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"username": "${ProducerUsername}"}'
        GenerateStringKey: password
        PasswordLength: 20
        RequireEachIncludedType: true
        ExcludePunctuation: true

  ConsumerUserSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${AWS::StackName}-kafka-consumer-credentials"
      Description: Cognito credentials for the Kafka consumer client
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"username": "${ConsumerUsername}"}'
        GenerateStringKey: password
        PasswordLength: 20
        RequireEachIncludedType: true
        ExcludePunctuation: true

  CognitoAdminUser:
    Type: AWS::Cognito::UserPoolUser
    Properties:
      UserPoolId: !Ref CognitoUserPool
      Username: !Ref AdminUsername
      MessageAction: SUPPRESS

  CognitoProducerUser:
    Type: AWS::Cognito::UserPoolUser
    Properties:
      UserPoolId: !Ref CognitoUserPool
      Username: !Ref ProducerUsername
      MessageAction: SUPPRESS

  CognitoConsumerUser:
    Type: AWS::Cognito::UserPoolUser
    Properties:
      UserPoolId: !Ref CognitoUserPool
      Username: !Ref ConsumerUsername
      MessageAction: SUPPRESS

  # ---- Security Groups ----
  KafkaBrokerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for the self-managed Kafka brokers
      GroupName: !Sub "${AWS::StackName}-kafka-broker-sg"
      VpcId: !Ref VPC
      SecurityGroupIngress:
        # Kafka clients (9092, SASL_SSL with OAUTHBEARER) from anywhere inside the VPC:
        # the client instance and the AWS Lambda event source mapping's ENIs. The
        # PLAINTEXT controller (9093) and internal (9094) listeners are opened
        # below to the brokers and the client instance only.
        - IpProtocol: tcp
          FromPort: 9092
          ToPort: 9092
          CidrIp: !FindInMap ['SubnetConfig', 'VPC', 'CIDR']
        # SSH from within the VPC (used by EC2 Instance Connect endpoint)
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !FindInMap ['SubnetConfig', 'VPC', 'CIDR']

  # The controller (9093) and internal (9094) listeners are PLAINTEXT, and the
  # internal listener's anonymous principal is a Kafka super user. Only the brokers
  # use them, plus the client instance, which creates the topic and ACLs through
  # 9094 at boot. (A security group can't reference itself in its own inline rules,
  # so these are separate resources.)
  KafkaBrokerInternalIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref KafkaBrokerSecurityGroup
      Description: Kafka controller and internal listeners, between brokers
      IpProtocol: tcp
      FromPort: 9093
      ToPort: 9094
      SourceSecurityGroupId: !Ref KafkaBrokerSecurityGroup
  KafkaBrokerAdminIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref KafkaBrokerSecurityGroup
      Description: Internal listener, for topic and ACL setup from the client instance
      IpProtocol: tcp
      FromPort: 9094
      ToPort: 9094
      SourceSecurityGroupId: !GetAtt KafkaClientInstanceSecurityGroup.GroupId

  KafkaClientInstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for the Kafka client / SAM deployment EC2 instance
      GroupName: !Sub "${AWS::StackName}-kafka-client-sg"
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !FindInMap ['SubnetConfig', 'VPC', 'CIDR']

  # ---- IAM role / instance profile for the EC2 instances ----
  EC2Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: 'sts:AssumeRole'
      Path: "/"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        # What runs on these instances needs: the boot scripts, `sam deploy` (AWS
        # CloudFormation creates the SAM stack's resources with these credentials),
        # and the AWS CLI deploy and teardown scripts. Everything the samples create
        # is named with this stack's name as a prefix: the SAM stack (<stack>-sam)
        # and its function, role, table and log group, and the CLI script's
        # <stack>-consumer function and role. Deploy the SAM stack under a name that
        # starts with this stack's name, as the README does.
        - PolicyName: SampleDeployAccess
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              # Boot: signal CloudFormation when setup is done.
              - Sid: ThisStack
                Effect: Allow
                Action:
                  - cloudformation:SignalResource
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackResources
                Resource: !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*'
              # The brokers cache the Kafka download and share their certificate here.
              - Sid: KafkaCacheBucket
                Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource: !Sub 'arn:${AWS::Partition}:s3:::kafka-oauth-cache-${AWS::AccountId}-${AWS::Region}'
              - Sid: KafkaCacheObjects
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::kafka-oauth-cache-${AWS::AccountId}-${AWS::Region}/*'
              # sam deploy: the SAM stack, SAM's artifact bucket stack, and the transform.
              - Sid: SampleStacks
                Effect: Allow
                Action: cloudformation:*
                Resource:
                  - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}-*/*'
                  - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/aws-sam-cli-managed-default/*'
              - Sid: ServerlessTransform
                Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource: !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31'
              - Sid: TemplateChecks
                Effect: Allow
                Action:
                  - cloudformation:ValidateTemplate
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ListStacks
                Resource: '*'
              - Sid: SamArtifactBucket
                Effect: Allow
                Action: s3:*
                Resource:
                  - !Sub 'arn:${AWS::Partition}:s3:::aws-sam-cli-managed-default-samclisourcebucket-*'
                  - !Sub 'arn:${AWS::Partition}:s3:::aws-sam-cli-managed-default-samclisourcebucket-*/*'
              # The consumer function, its event source mapping, role, table and logs.
              - Sid: SampleFunctions
                Effect: Allow
                Action: lambda:*
                Resource: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-*'
              - Sid: CreateSampleEventSourceMappings
                Effect: Allow
                Action:
                  - lambda:CreateEventSourceMapping
                  - lambda:UpdateEventSourceMapping
                  - lambda:DeleteEventSourceMapping
                Resource: '*'
                Condition:
                  ArnLike:
                    lambda:FunctionArn: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-*'
              - Sid: ListEventSourceMappings
                Effect: Allow
                Action: lambda:ListEventSourceMappings
                Resource: '*'
              - Sid: ReadAndTagEventSourceMappings
                Effect: Allow
                Action:
                  - lambda:GetEventSourceMapping
                  - lambda:TagResource
                  - lambda:UntagResource
                  - lambda:ListTags
                Resource: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:event-source-mapping:*'
              - Sid: DescribeNetworkForEventSource
                Effect: Allow
                Action:
                  - ec2:DescribeSubnets
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeVpcs
                  - ec2:DescribeNetworkInterfaces
                Resource: '*'
              - Sid: SampleRoles
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:UpdateRole
                  - iam:UpdateRoleDescription
                  - iam:UpdateAssumeRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:ListRoleTags
                  - iam:PutRolePolicy
                  - iam:GetRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AWS::StackName}-*'
              # The only managed policy the sample roles use.
              - Sid: AttachLambdaBasicExecution
                Effect: Allow
                Action:
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AWS::StackName}-*'
                Condition:
                  ArnEquals:
                    iam:PolicyARN: !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
              - Sid: PassSampleRolesToLambda
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AWS::StackName}-*'
                Condition:
                  StringEquals:
                    iam:PassedToService: lambda.amazonaws.com
              # Create the table, write to it from `sam local invoke`, and read it to
              # check results. Covers <stack>-sam-messages and the CLI's <stack>-messages.
              - Sid: SampleTables
                Effect: Allow
                Action: dynamodb:*
                Resource:
                  - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AWS::StackName}-*'
                  - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AWS::StackName}-*/*'
              - Sid: ListTables
                Effect: Allow
                Action: dynamodb:ListTables
                Resource: '*'
              - Sid: SampleLogGroups
                Effect: Allow
                Action: logs:*
                Resource:
                  - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-*'
                  - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-*:*'
              - Sid: DescribeLogGroups
                Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: '*'
        - PolicyName: CognitoAccess
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              # InitiateAuth has no resource type; everything else is scoped to this
              # stack's user pool.
              - Effect: Allow
                Action: 'cognito-idp:InitiateAuth'
                Resource: '*'
              - Effect: Allow
                Action:
                  - 'cognito-idp:AdminInitiateAuth'
                  - 'cognito-idp:AdminSetUserPassword'
                  - 'cognito-idp:AdminGetUser'
                  - 'cognito-idp:DescribeUserPool'
                  - 'cognito-idp:DescribeUserPoolClient'
                Resource: !GetAtt CognitoUserPool.Arn
        - PolicyName: SecretsManagerAccess
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - 'secretsmanager:GetSecretValue'
                  - 'secretsmanager:DescribeSecret'
                Resource:
                  - !Ref AdminUserSecret
                  - !Ref ProducerUserSecret
                  - !Ref ConsumerUserSecret
              # Let the CLI Lambda deploy script (run on the client) create the
              # OAuth + broker-CA secrets it wires into the event source mapping.
              - Effect: Allow
                Action:
                  - 'secretsmanager:CreateSecret'
                  - 'secretsmanager:DeleteSecret'
                  - 'secretsmanager:PutSecretValue'
                  - 'secretsmanager:TagResource'
                  - 'secretsmanager:GetSecretValue'
                  - 'secretsmanager:DescribeSecret'
                Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AWS::StackName}-*'

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Join ['-', ['EC2KafkaOAuthProfile', !Ref 'AWS::StackName']]
      Roles:
        - !Ref EC2Role

  # ---- Kafka broker EC2 instances (KRaft mode, SASL/OAUTHBEARER) ----
  KafkaBroker1:
    Type: AWS::EC2::Instance
    DependsOn: PrivateRoute
    Properties:
      InstanceType: m5.large
      IamInstanceProfile: !Ref EC2InstanceProfile
      SubnetId: !Ref PrivateSubnetOne
      PrivateIpAddress: !FindInMap ['BrokerConfig', 'Broker1', 'PrivateIp']
      SecurityGroupIds: [!GetAtt KafkaBrokerSecurityGroup.GroupId]
      ImageId: !Ref LatestAmiId
      Tags:
        - Key: 'Name'
          Value: 'KafkaBroker1'
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 50
            VolumeType: gp3
            DeleteOnTermination: true
      UserData:
        Fn::Base64:
          Fn::Sub:
            - |
              #!/bin/bash -xe
              exec > /var/log/kafka-broker-setup.log 2>&1

              NODE_ID=${node_id}
              BROKER_IP=${broker_ip}
              QUORUM_VOTERS=${quorum_voters}
              REGION=${region}
              USER_POOL_ID=${user_pool_id}
              KAFKA_URL=${kafka_installer}
              STRIMZI_VERSION=${strimzi_version}
              NIMBUS_VERSION=${nimbus_version}
              KAFKA_CLUSTER_ID=${kafka_cluster_id}
              ADMIN_USERNAME=${admin_username}
              POLLER_CLIENT_ID=${poller_client_id}

              install_pkg() {
                for i in 1 2 3 4 5; do
                  yum install -y "$@" && return 0
                  echo "yum install $* failed, retry $i"; sleep 5
                done
                return 1
              }
              yum update -y
              install_pkg java-17-amazon-corretto-headless wget tar

              cd /home/ec2-user
              KAFKA_TGZ=$(basename "$KAFKA_URL")
              KAFKA_DIR=$(basename "$KAFKA_TGZ" .tgz)
              # Download Kafka once (broker 1 seeds it to an S3 cache); the other
              # brokers and the client fetch it from S3 in-region instead of each
              # pulling the throttled archive.apache.org copy. The cache bucket
              # persists across redeploys, so later deploys skip the download.
              KCREGION=${region}
              ACCOUNT_ID=$(aws sts get-caller-identity --region "$KCREGION" --query Account --output text)
              KAFKA_CACHE_BUCKET="kafka-oauth-cache-$ACCOUNT_ID-$KCREGION"
              KAFKA_S3_URI="s3://$KAFKA_CACHE_BUCKET/kafka/$KAFKA_TGZ"
              SEEDER=false
              if [ "$NODE_ID" = "1" ]; then SEEDER=true; fi
              download_from_archive() {
                for attempt in 1 2 3 4 5 6; do
                  wget --timeout=60 --read-timeout=120 --tries=2 -O "$KAFKA_TGZ" "$KAFKA_URL" && test -s "$KAFKA_TGZ" && return 0
                  echo "Kafka archive download attempt $attempt failed; retrying in 20s..."; sleep 20
                done
                return 1
              }
