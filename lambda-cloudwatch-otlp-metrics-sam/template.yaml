AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Send custom application metrics from AWS Lambda to Amazon CloudWatch over the
  OpenTelemetry Protocol (OTLP). The AWS Distro for OpenTelemetry (ADOT) Lambda
  layer runs a collector that signs each request with AWS Signature Version 4
  and forwards OTLP metrics to the CloudWatch OTLP endpoint, so the function code
  never calls PutMetricData and writes no embedded metric format logs.
  (lambda-cloudwatch-otlp-metrics-sam)

Parameters:
  AdotLayerArn:
    Type: String
    Default: arn:aws:lambda:us-east-1:901920570463:layer:aws-otel-python-amd64-ver-1-32-0:7
    Description: >
      ARN of the AWS Distro for OpenTelemetry Python Lambda layer. The layer is
      published only in the Regions listed in the ADOT Lambda documentation, and the
      ARN is Region and architecture specific. See the README for the Region list.
  ServiceName:
    Type: String
    Default: orders-service
    Description: Value reported as the service.name resource attribute on every metric.

Resources:
  # The stack owns the function log group so that deleting the stack also deletes
  # the logs. A log group that AWS Lambda creates implicitly is not part of the
  # stack and survives stack deletion. No LogGroupName is set, so CloudFormation
  # generates a unique name and two stacks can coexist in one account.
  MetricsFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 7

  MetricsFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # Basic Lambda logging permissions. The collector writes its own startup and
        # export diagnostics to the same log group, which the README uses for
        # troubleshooting.
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: PublishOtlpMetrics
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # cloudwatch:PutMetricData on Resource "*" is the policy AWS publishes for
              # the CloudWatch OTLP metrics endpoint, which does not support resource
              # level permissions. See the "IAM permissions required" section of
              # https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/metrics-otel-send.html
              - Sid: PublishMetrics
                Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: "*"

  MetricsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-otlp-metrics"
      CodeUri: src/
      Handler: handler.handler
      Runtime: python3.13
      # The default AdotLayerArn is the amd64 layer. To run on arm64, set this to
      # arm64 and change amd64 to arm64 in the AdotLayerArn value as well.
      Architectures:
        - x86_64
      Timeout: 30
      MemorySize: 256
      Role: !GetAtt MetricsFunctionRole.Arn
      LoggingConfig:
        LogGroup: !Ref MetricsFunctionLogGroup
      Layers:
        - !Ref AdotLayerArn
      Environment:
        Variables:
          # Starts the ADOT auto instrumentation wrapper and the bundled collector.
          AWS_LAMBDA_EXEC_WRAPPER: /opt/otel-instrument
          OPENTELEMETRY_COLLECTOR_CONFIG_URI: /var/task/collector.yaml
          OTEL_METRICS_EXPORTER: otlp
          OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
          OTEL_TRACES_EXPORTER: none
          OTEL_LOGS_EXPORTER: none
          OTEL_SERVICE_NAME: !Ref ServiceName

Outputs:
  MetricsFunctionName:
    Description: Name of the Lambda function that records the custom metrics.
    Value: !Ref MetricsFunction
  LogGroupName:
    Description: CloudWatch log group that the function and the collector write to.
    Value: !Ref MetricsFunctionLogGroup
  ServiceNameValue:
    Description: service.name attribute reported with every metric.
    Value: !Ref ServiceName
