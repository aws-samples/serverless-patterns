AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Lambda Managed Instances with SAM (Python).
  Runs a Lambda function on EC2 instances managed by AWS, with EC2 pricing
  advantages (Savings Plans, Reserved Instances) and multi-concurrency support. (uksb-1tthgi812) (tag:lambda-managed-instances-python-sam)

Parameters:
  VpcCIDR:
    Type: String
    Default: "10.0.0.0/16"
    Description: CIDR block for the VPC

Resources:
  # VPC for Managed Instances
  ManagedInstancesVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCIDR
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-vpc"

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref ManagedInstancesVPC
      CidrBlock: "10.0.1.0/24"
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-private-1"

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref ManagedInstancesVPC
      CidrBlock: "10.0.2.0/24"
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-private-2"

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Lambda Managed Instances
      VpcId: !Ref ManagedInstancesVPC
      # Egress to 443 so instances can reach the VPC interface endpoints
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref VpcCIDR
          Description: HTTPS to VPC endpoints within the VPC
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-sg"

  # --- Private networking (no internet path) ---
  # Managed Instances egress (e.g. CloudWatch Logs, ECR image pull) stays inside
  # the VPC and reaches AWS services over PrivateLink interface/gateway endpoints.

  # Explicit private route table for the subnets. It has only the implicit
  # local route (10.0.0.0/16) plus the S3 gateway endpoint route below —
  # there is deliberately no 0.0.0.0/0 route, so no internet egress.
  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref ManagedInstancesVPC
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-private-rt"

  PrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

  # Security group for the interface endpoints: allow inbound 443 from the
  # instance security group only.
  VPCEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTPS from Managed Instances to VPC interface endpoints
      VpcId: !Ref ManagedInstancesVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref SecurityGroup
          Description: HTTPS from Managed Instances
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-vpce-sg"

  # Interface endpoint: CloudWatch Logs (documented egress requirement for LMI)
  LogsEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref ManagedInstancesVPC
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.logs"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup

  # Interface endpoints: ECR API + Docker registry (instances pull the runtime image)
  EcrApiEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref ManagedInstancesVPC
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.ecr.api"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup

  EcrDkrEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref ManagedInstancesVPC
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.ecr.dkr"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup

  # Interface endpoint: EC2 (instance lifecycle calls)
  Ec2Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref ManagedInstancesVPC
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.ec2"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup

  # Gateway endpoint: S3 (ECR image layers are stored in S3). Bound to the
  # private route table via an AWS managed prefix list route.
  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref ManagedInstancesVPC
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PrivateRouteTable

  # IAM role for Capacity Provider operator
  CapacityProviderOperatorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-cp-operator-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AWSLambdaManagedEC2ResourceOperator

  # Lambda Capacity Provider — defines where functions run
  LambdaCapacityProvider:
    Type: AWS::Lambda::CapacityProvider
    Properties:
      CapacityProviderName: !Sub "${AWS::StackName}-capacity-provider"
      VpcConfig:
        SubnetIds:
          - !Ref PrivateSubnet1
          - !Ref PrivateSubnet2
        SecurityGroupIds:
          - !Ref SecurityGroup
      InstanceRequirements:
        Architectures:
          - arm64
      PermissionsConfig:
        CapacityProviderOperatorRoleArn: !GetAtt CapacityProviderOperatorRole.Arn

  # CloudWatch Logs
  ApiHandlerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-api-handler"
      RetentionInDays: 14

  # Lambda execution role
  ApiHandlerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  # Lambda function running on Managed Instances
  # Note: no explicit DependsOn is needed — the LoggingConfig !Ref to
  # ApiHandlerLogGroup and the CapacityProviderConfig !GetAtt to
  # LambdaCapacityProvider already enforce correct creation order.
  ApiHandlerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-api-handler"
      Runtime: python3.13
      Handler: index.lambda_handler
      Code:
        ZipFile: |
          import json
          import threading
          from datetime import datetime, timezone

          _lock = threading.Lock()
          _count = 0

          def lambda_handler(event, context):
              global _count
              with _lock:
                  _count += 1
                  count = _count
              name = event.get("name", "Managed Instances")
              return {
                  "statusCode": 200,
                  "body": json.dumps({
                      "message": f"Hello, {name}!",
                      "invocation": count,
                      "timestamp": datetime.now(timezone.utc).isoformat(),
                      "version": context.function_version
                  })
              }
      Architectures:
        - arm64
      MemorySize: 2048
      Timeout: 30
      Description: Python API handler running on Lambda Managed Instances
      Role: !GetAtt ApiHandlerRole.Arn
      CapacityProviderConfig:
        LambdaManagedInstancesCapacityProviderConfig:
          CapacityProviderArn: !GetAtt LambdaCapacityProvider.Arn
      LoggingConfig:
        LogGroup: !Ref ApiHandlerLogGroup

  # Publish a version (required for Managed Instances invocation)
  ApiHandlerVersion:
    Type: AWS::Lambda::Version
    Properties:
      FunctionName: !Ref ApiHandlerFunction
      Description: Initial version for Managed Instances

  # Alias for stable invocation endpoint
  ApiHandlerAlias:
    Type: AWS::Lambda::Alias
    Properties:
      FunctionName: !Ref ApiHandlerFunction
      FunctionVersion: !GetAtt ApiHandlerVersion.Version
      Name: live

Outputs:
  FunctionName:
    Description: Lambda function name
    Value: !Ref ApiHandlerFunction

  FunctionAlias:
    Description: Function alias ARN for invocation
    Value: !Ref ApiHandlerAlias

  CapacityProviderArn:
    Description: Capacity provider ARN
    Value: !GetAtt LambdaCapacityProvider.Arn

  VpcId:
    Description: VPC ID
    Value: !Ref ManagedInstancesVPC

  PrivateRouteTableId:
    Description: Private route table ID (no internet route; S3 gateway + local only)
    Value: !Ref PrivateRouteTable
