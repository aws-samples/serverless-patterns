AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Move an Express job runner's work out of the web process into Amazon SQS + a
  Lambda consumer, keeping the same /v1 routes, job ids and status endpoint. The
  API Lambda enqueues to SQS and returns; the worker Lambda runs the same step
  code and writes status back to the shared jobs table. (uksb-1tthgi812) (tag:lambda-sqs-fastapi-typescript-sam)

Globals:
  Function:
    Runtime: nodejs24.x
    Architectures:
      - arm64
    MemorySize: 256
    Timeout: 30
    Tracing: Active
    Environment:
      Variables:
        JOBS_TABLE: !Ref JobsTable

Resources:
  JobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-jobs
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: job_id
          AttributeType: S
      KeySchema:
        - AttributeName: job_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  JobsApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      TracingEnabled: true

  JobsDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  JobsQueue:
    Type: AWS::SQS::Queue
    Properties:
      # Give the worker room to run all three steps before the message becomes
      # visible again. AWS recommends >= 6x the function timeout; the worker is
      # 60s, so 6x is 360 - 420 keeps a margin above the floor.
      VisibilityTimeout: 420
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt JobsDeadLetterQueue.Arn
        maxReceiveCount: 3

  JobsQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref JobsQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: sqs:*
            Resource: !GetAtt JobsQueue.Arn
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  JobsDeadLetterQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref JobsDeadLetterQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: sqs:*
            Resource: !GetAtt JobsDeadLetterQueue.Arn
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  JobApiFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-job-api
      RetentionInDays: 14

  JobApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: The Express API - enqueues a job to SQS and reads its status
      CodeUri: after/
      Handler: api.handler
      Timeout: 10
      LoggingConfig:
        LogGroup: !Ref JobApiFunctionLogGroup
      Environment:
        Variables:
          JOBS_QUEUE_URL: !Ref JobsQueue
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
              Resource: !GetAtt JobsTable.Arn
        - Statement:
            - Effect: Allow
              Action: sqs:SendMessage
              Resource: !GetAtt JobsQueue.Arn
      Events:
        CreateJob:
          Type: Api
          Properties:
            RestApiId: !Ref JobsApi
            Path: /v1/jobs
            Method: POST
        GetJob:
          Type: Api
          Properties:
            RestApiId: !Ref JobsApi
            Path: /v1/jobs/{job_id}
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Target: es2022
        Format: esm
        OutExtension:
          - .js=.mjs
        External:
          - '@aws-sdk/*'
        # Express (CommonJS deps) needs require() available in an ESM bundle.
        Banner:
          - js=import { createRequire } from 'node:module'; const require = createRequire(import.meta.url);
        EntryPoints:
          - api.ts

  JobWorkerFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-job-worker
      RetentionInDays: 14

  JobWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: The SQS consumer - runs the same step code the API process used to run
      CodeUri: after/
      Handler: worker.handler
      Timeout: 60
      LoggingConfig:
        LogGroup: !Ref JobWorkerFunctionLogGroup
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !GetAtt JobsTable.Arn
      Events:
        JobMessages:
          Type: SQS
          Properties:
            Queue: !GetAtt JobsQueue.Arn
            BatchSize: 5
            FunctionResponseTypes:
              - ReportBatchItemFailures
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Target: es2022
        Format: esm
        OutExtension:
          - .js=.mjs
        External:
          - '@aws-sdk/*'
        EntryPoints:
          - worker.ts

Outputs:
  ApiUrl:
    Description: Base URL - POST /v1/jobs, GET /v1/jobs/{job_id}
    Value: !Sub https://${JobsApi}.execute-api.${AWS::Region}.amazonaws.com/prod
  JobsTableName:
    Description: Shared jobs table
    Value: !Ref JobsTable
  JobsQueueUrl:
    Description: Queue the API enqueues jobs to
    Value: !Ref JobsQueue
  JobsDeadLetterQueueUrl:
    Description: Receives any job message that fails maxReceiveCount deliveries
    Value: !Ref JobsDeadLetterQueue
