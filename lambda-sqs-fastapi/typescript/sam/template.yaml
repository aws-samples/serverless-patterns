AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Move an Express job runner's work out of the web process into Amazon SQS + a
  Lambda consumer, keeping the same /v1 routes, job ids and status endpoint. The
  API Lambda enqueues to SQS and returns; the worker Lambda runs the same step
  code and writes status back to the shared jobs table. (uksb-1tthgi812) (tag:lambda-sqs-fastapi-typescript-sam)

Globals:
  Function:
    Runtime: nodejs24.x
    Architectures:
      - arm64
    MemorySize: 256
    Timeout: 30
    Tracing: Active
    Environment:
      Variables:
        JOBS_TABLE: !Ref JobsTable
        # Powertools for AWS Lambda (TypeScript): structured logs, EMF metrics.
        POWERTOOLS_SERVICE_NAME: !Sub ${AWS::StackName}-jobs
        POWERTOOLS_LOG_LEVEL: INFO
        POWERTOOLS_METRICS_NAMESPACE: !Ref AWS::StackName

Resources:
  JobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-jobs
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: job_id
          AttributeType: S
      KeySchema:
        - AttributeName: job_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  JobsApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/apigateway/${AWS::StackName}-jobs-api-access
      RetentionInDays: 14

  # API Gateway writes access logs through ONE account-level role per Region.
  # AWS::ApiGateway::Account sets that role; deploying this template re-points
  # it at this role (any other REST API in the Region keeps logging through it).
  ApiGatewayCloudWatchRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: apigateway.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonAPIGatewayPushToCloudWatchLogs

  ApiGatewayAccount:
    Type: AWS::ApiGateway::Account
    Properties:
      CloudWatchRoleArn: !GetAtt ApiGatewayCloudWatchRole.Arn

  JobsApi:
    Type: AWS::Serverless::Api
    DependsOn: ApiGatewayAccount
    Properties:
      StageName: prod
      TracingEnabled: true
      # Callers must sign requests with SigV4 (IAM). Swap for a Cognito or
      # Lambda authorizer if your clients are not AWS principals.
      Auth:
        DefaultAuthorizer: AWS_IAM
      AccessLogSetting:
        DestinationArn: !GetAtt JobsApiAccessLogGroup.Arn
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","requestTime":"$context.requestTime","httpMethod":"$context.httpMethod","resourcePath":"$context.resourcePath","status":"$context.status","protocol":"$context.protocol","responseLength":"$context.responseLength","integrationLatency":"$context.integrationLatency"}'
      # Execution logs (LoggingLevel / DataTraceEnabled) are left off: they can
      # carry request bodies. Access logs + metrics are enough to operate this.
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          MetricsEnabled: true
          ThrottlingRateLimit: 50     # steady-state req/s
          ThrottlingBurstLimit: 100   # burst

  JobsDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  JobsQueue:
    Type: AWS::SQS::Queue
    Properties:
      # Give the worker room to run all three steps before the message becomes
      # visible again. AWS recommends >= 6x the function timeout; the worker is
      # 60s, so 6x is 360 - 420 keeps a margin above the floor.
      VisibilityTimeout: 420
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt JobsDeadLetterQueue.Arn
        maxReceiveCount: 3

  JobsQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref JobsQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: sqs:*
            Resource: !GetAtt JobsQueue.Arn
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  JobsDeadLetterQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref JobsDeadLetterQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: sqs:*
            Resource: !GetAtt JobsDeadLetterQueue.Arn
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  JobApiFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-job-api
      RetentionInDays: 14

  JobApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: The Express API - enqueues a job to SQS and reads its status
      CodeUri: after/
      Handler: api.handler
      Timeout: 10
      LoggingConfig:
        LogGroup: !Ref JobApiFunctionLogGroup
      Environment:
        Variables:
          JOBS_QUEUE_URL: !Ref JobsQueue
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:DeleteItem   # roll the PENDING row back if SendMessage fails
              Resource: !GetAtt JobsTable.Arn
        - SQSSendMessagePolicy:
            QueueName: !GetAtt JobsQueue.QueueName
      Events:
        CreateJob:
          Type: Api
          Properties:
            RestApiId: !Ref JobsApi
            Path: /v1/jobs
            Method: POST
        GetJob:
          Type: Api
          Properties:
            RestApiId: !Ref JobsApi
            Path: /v1/jobs/{job_id}
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Target: es2022
        Format: esm
        OutExtension:
          - .js=.mjs
        External:
          - '@aws-sdk/*'
        # Express (CommonJS deps) needs require() available in an ESM bundle.
        Banner:
          - js=import { createRequire } from 'node:module'; const require = createRequire(import.meta.url);
        EntryPoints:
          - api.ts

  JobWorkerFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-job-worker
      RetentionInDays: 14

  JobWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: The SQS consumer - runs the same step code the API process used to run
      CodeUri: after/
      Handler: worker.handler
      Timeout: 60
      LoggingConfig:
        LogGroup: !Ref JobWorkerFunctionLogGroup
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !GetAtt JobsTable.Arn
      Events:
        JobMessages:
          Type: SQS
          Properties:
            Queue: !GetAtt JobsQueue.Arn
            # 5, not the usual 10: each job is three steps of ~0.5s run one
            # after another, so 5 keeps a batch well inside the 60s timeout.
            BatchSize: 5
            FunctionResponseTypes:
              - ReportBatchItemFailures
            # Cap concurrent worker invocations so a burst of jobs cannot
            # overwhelm the table or any downstream the steps call. Set
            # ReservedConcurrentExecutions: 0 on this function to pause
            # consumption entirely (messages wait in the queue).
            ScalingConfig:
              MaximumConcurrency: 10
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Target: es2022
        Format: esm
        OutExtension:
          - .js=.mjs
        External:
          - '@aws-sdk/*'
        # The Powertools Tracer bundles aws-xray-sdk-core (CommonJS), which
        # needs require() available in an ESM bundle.
        Banner:
          - js=import { createRequire } from 'node:module'; const require = createRequire(import.meta.url);
        EntryPoints:
          - worker.ts

  # Alarms with no AlarmActions: wire them to your own SNS topic / on-call tool.
  JobsDlqDepthAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: A job message exhausted maxReceiveCount and landed in the DLQ
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt JobsDeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  JobWorkerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The worker Lambda reported invocation errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref JobWorkerFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  JobWorkerThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The worker Lambda was throttled
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref JobWorkerFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  JobApiErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The API Lambda reported invocation errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref JobApiFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  JobApiThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The API Lambda was throttled
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref JobApiFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

Outputs:
  ApiUrl:
    Description: Base URL - POST /v1/jobs, GET /v1/jobs/{job_id}
    Value: !Sub https://${JobsApi}.execute-api.${AWS::Region}.amazonaws.com/prod
  JobsTableName:
    Description: Shared jobs table
    Value: !Ref JobsTable
  JobsQueueUrl:
    Description: Queue the API enqueues jobs to
    Value: !Ref JobsQueue
  JobsDeadLetterQueueUrl:
    Description: Receives any job message that fails maxReceiveCount deliveries
    Value: !Ref JobsDeadLetterQueue
  JobApiFunctionName:
    Description: API Lambda (tail with sam logs)
    Value: !Ref JobApiFunction
  JobWorkerFunctionName:
    Description: Worker Lambda (tail with sam logs)
    Value: !Ref JobWorkerFunction
