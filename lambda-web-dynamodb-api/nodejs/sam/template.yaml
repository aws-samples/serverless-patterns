AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Serverless patterns - Express.js CRUD API on AWS Lambda Web Functions
  backed by an Amazon DynamoDB table (SAM).

Parameters:
  CodeBucket:
    Type: String
    Description: >
      Name of an existing, versioning-enabled S3 bucket in this Region that
      holds function.zip. Its bucket policy must grant lambda.amazonaws.com
      s3:GetObject and s3:GetObjectVersion. See the README for the setup.
  CodeKey:
    Type: String
    Default: lambda-web-dynamodb-api-sam/function.zip
    Description: S3 key of the uploaded function.zip.

Resources:
  # On-demand table keyed by "id". The name is generated by CloudFormation
  # and passed to the app through an environment variable.
  ItemsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true

  # Execution role for the web function: CloudWatch Logs plus the four
  # DynamoDB actions the API uses, scoped to the table ARN.
  WebFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ItemsTableAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Scan
                Resource: !GetAtt ItemsTable.Arn

  # One AWS::Serverless::WebFunction expands into AWS::Lambda::WebFunction,
  # AWS::Lambda::WebFunctionRevision (immutable code + config) and
  # AWS::Lambda::WebFunctionEndpoint (HTTPS endpoint, 100% to that revision).
  WebFunction:
    Type: AWS::Serverless::WebFunction
    Properties:
      Runtime: nodejs24.x
      CodeUri:
        Bucket: !Ref CodeBucket
        Key: !Ref CodeKey
      Timeout: 30
      # ApplicationManaged = the endpoint is PUBLIC and the app owns
      # authentication. Use IamAuth to require SigV4-signed requests.
      AuthType: ApplicationManaged
      EndpointType: HomeRegion
      AutoDeploymentMode: LatestRevision
      ExecutionRoleArn: !GetAtt WebFunctionRole.Arn
      EnvironmentVariables:
        TABLE_NAME: !Ref ItemsTable
      LoggingConfig:
        LogGroup: !Sub /aws/lambda/web/${AWS::StackName}

Outputs:
  EndpointDomainName:
    Description: HTTPS domain of the Lambda Web Function endpoint
    Value: !GetAtt WebFunctionEndpoint.DomainName
  FunctionArn:
    Description: ARN of the Lambda Web Function
    Value: !GetAtt WebFunction.FunctionArn
  TableName:
    Description: DynamoDB table used by the API
    Value: !Ref ItemsTable
  LogGroupName:
    Description: CloudWatch Logs group the web function writes to
    Value: !Sub /aws/lambda/web/${AWS::StackName}
