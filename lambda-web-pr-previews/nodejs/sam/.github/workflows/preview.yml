# Deploys every pull request to its own preview URL and deletes it when the pull request closes.
name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

# One run at a time per pull request, so a close never races a deploy.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  id-token: write       # to assume the AWS role with OIDC
  contents: read
  pull-requests: write  # to comment the preview URL

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  STACK_NAME: ${{ vars.STACK_NAME || 'lambda-web-pr-previews' }}
  PR_NUMBER: ${{ github.event.pull_request.number }}

jobs:
  preview:
    # GitHub does not issue OIDC tokens to pull requests from forks, so skip them explicitly.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install AWS CLI 2.37.13 or later
        run: |
          curl -sSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
          unzip -q /tmp/awscliv2.zip -d /tmp
          sudo /tmp/aws/install --update
          aws --version

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PREVIEW_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy preview
        id: deploy
        if: github.event.action != 'closed'
        env:
          GIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/deploy.sh preview "$PR_NUMBER"

      - name: Delete preview
        if: github.event.action == 'closed'
        run: scripts/deploy.sh delete-preview "$PR_NUMBER"

      - name: Comment on the pull request
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const marker = "<!-- lambda-web-pr-preview -->";
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const body = context.payload.action === "closed"
              ? `${marker}\nPreview deleted.`
              : `${marker}\nPreview: ${process.env.PREVIEW_URL}\n\nCommit \`${sha}\`. The URL stays the same for every push to this pull request.`;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number });
            const existing = comments.find((c) => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else if (context.payload.action !== "closed") {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }
