AWSTemplateFormatVersion: '2010-09-09'
Description: Kafka client instance in a private subnet. Connect with Session Manager; there is no SSH access.
Parameters:
  PrivateSubnet:
    Type: String
    Description: 'Private Subnet'
  MSKProducerSGID:
    Type: String
  MSKCluster:
    Type: String
    Description: 'MSK Cluster ARN'
  ClusterName:
    Type: String
  ClusterId:
    Type: String
  MSKTopic:
    Type: String
  ApacheKafkaInstallerLocation:
    Type: String
    Default: https://archive.apache.org/dist/kafka/4.1.2/kafka_2.13-4.1.2.tgz
  LatestAmiId:
    Type: 'AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>'
    Default: '/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-6.1-x86_64'

Resources:
  # The instance has no public IP address. The SSM agent reaches Systems Manager
  # through the VPC's NAT gateway.
  KafkaClientEC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.small
      IamInstanceProfile: !Ref EC2InstanceProfile
      SubnetId: !Ref PrivateSubnet
      SecurityGroupIds: [!Ref MSKProducerSGID]
      ImageId: !Ref LatestAmiId
      MetadataOptions:
        HttpTokens: required
      Tags:
        - Key: 'Name'
          Value: 'KafkaClientInstance'
      UserData: 
        Fn::Base64: 
          !Sub |
            #!/bin/bash
            dnf install -y java-21-amazon-corretto-headless
            cd /home/ec2-user
            curl -sSfL -o kafka.tgz ${ApacheKafkaInstallerLocation}
            mkdir kafka && tar -xzf kafka.tgz -C kafka --strip-components 1 && rm kafka.tgz
            curl -sSfL -o kafka/libs/aws-msk-iam-auth-2.2.0-all.jar https://github.com/aws/aws-msk-iam-auth/releases/download/v2.2.0/aws-msk-iam-auth-2.2.0-all.jar
            cat > kafka/client.properties <<'EOF'
            security.protocol=SASL_SSL
            sasl.mechanism=AWS_MSK_IAM
            sasl.jaas.config=software.amazon.msk.auth.iam.IAMLoginModule required;
            sasl.client.callback.handler.class=software.amazon.msk.auth.iam.IAMClientCallbackHandler
            EOF
            echo "export AWS_REGION=${AWS::Region}" >> /home/ec2-user/.bashrc
            echo "export CLUSTER_ARN=${MSKCluster}" >> /home/ec2-user/.bashrc
            echo "export TOPIC=${MSKTopic}" >> /home/ec2-user/.bashrc
            chown -R ec2-user:ec2-user /home/ec2-user

  EC2Role: 
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument: 
        Version: 2012-10-17
        Statement:
          - Sid: ''
            Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: 'sts:AssumeRole'
      Path: "/"
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore'
      
  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties: 
      Roles:
        - !Ref EC2Role

  KafkaClientEC2InstancePolicy:
    Type: 'AWS::IAM::Policy'
    Properties:
      PolicyName: KafkaClientEC2InstancePolicy
      PolicyDocument:
        Version: 2012-10-17
        Statement:
              - Effect: Allow
                Action:
                  - kafka:DescribeClusterV2
                  - kafka:GetBootstrapBrokers
                Resource: !Ref MSKCluster
              - Effect: Allow
                Action:
                  - kafka-cluster:Connect
                  - kafka-cluster:DescribeCluster
                Resource: !Ref MSKCluster
              - Effect: Allow
                Action:
                  - kafka-cluster:CreateTopic
                  - kafka-cluster:DescribeTopic
                  - kafka-cluster:WriteData
                  - kafka-cluster:ReadData
                Resource: !Sub 'arn:${AWS::Partition}:kafka:${AWS::Region}:${AWS::AccountId}:topic/${ClusterName}/${ClusterId}/*'
              - Effect: Allow
                Action:
                  - kafka-cluster:AlterGroup
                  - kafka-cluster:DescribeGroup
                Resource: !Sub 'arn:${AWS::Partition}:kafka:${AWS::Region}:${AWS::AccountId}:group/${ClusterName}/${ClusterId}/*'
      Roles:
        - !Ref EC2Role

Outputs:
  KafkaClientInstanceId:
    Description: Kafka client instance. Connect to it with Session Manager.
    Value: !Ref KafkaClientEC2Instance
