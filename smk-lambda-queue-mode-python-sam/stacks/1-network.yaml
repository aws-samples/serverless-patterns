AWSTemplateFormatVersion: '2010-09-09'
Description: KQD Stack 1 - Networking (VPC, subnets, IGW, security groups)

Resources:

  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: kqd-vpc

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: kqd-igw

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.0.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: kqd-public

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: kqd-public-rt

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRTAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - Key: Name
          Value: kqd-private-a

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags:
        - Key: Name
          Value: kqd-private-b

  PrivateSubnetC:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.3.0/24
      AvailabilityZone: !Select [2, !GetAZs ""]
      Tags:
        - Key: Name
          Value: kqd-private-c

  BrokerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Kafka broker - PLAINTEXT 9092 from VPC
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 9092
          ToPort: 9092
          CidrIp: 10.0.0.0/16
          Description: Kafka PLAINTEXT from VPC
      Tags:
        - Key: Name
          Value: kqd-broker-sg

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Lambda functions - egress to Kafka 9092 and HTTPS
      VpcId: !Ref VPC
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 9092
          ToPort: 9092
          CidrIp: 10.0.0.0/16
          Description: Kafka PLAINTEXT
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS for AWS APIs and VPC endpoints
      Tags:
        - Key: Name
          Value: kqd-lambda-sg

  # Allow inbound 443 from VPC (VPC endpoint ENIs need this)
  LambdaSGIngressVPC:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref LambdaSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: 10.0.0.0/16
      Description: VPC endpoints HTTPS inbound

  # Self-referencing rule so Hyperplane ENIs can reach endpoint ENIs
  LambdaSGIngressSelf:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref LambdaSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !Ref LambdaSecurityGroup
      Description: Self - Hyperplane ENI to VPC endpoint ENI

  # VPC Interface Endpoint for Lambda (allows ESM pollers to invoke Lambda)
  # NOTE: Created separately via CLI if this stack is deployed fresh:
  #   aws ec2 create-vpc-endpoint --vpc-endpoint-type Interface \
  #     --vpc-id <VpcId> --service-name com.amazonaws.<region>.lambda \
  #     --subnet-ids <private-subnets> --security-group-ids <LambdaSG> \
  #     --private-dns-enabled --region <region>
  # Same for com.amazonaws.<region>.sts
  # These endpoints are not managed here to avoid conflict on update.

Outputs:
  VpcId:
    Value: !Ref VPC
    Export:
      Name: kqd-VpcId

  PublicSubnetId:
    Value: !Ref PublicSubnet
    Export:
      Name: kqd-PublicSubnetId

  PrivateSubnetA:
    Value: !Ref PrivateSubnetA
    Export:
      Name: kqd-PrivateSubnetA

  PrivateSubnetB:
    Value: !Ref PrivateSubnetB
    Export:
      Name: kqd-PrivateSubnetB

  PrivateSubnetC:
    Value: !Ref PrivateSubnetC
    Export:
      Name: kqd-PrivateSubnetC

  BrokerSecurityGroupId:
    Value: !Ref BrokerSecurityGroup
    Export:
      Name: kqd-BrokerSecurityGroupId

  LambdaSecurityGroupId:
    Value: !Ref LambdaSecurityGroup
    Export:
      Name: kqd-LambdaSecurityGroupId
