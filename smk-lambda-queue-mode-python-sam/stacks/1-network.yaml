AWSTemplateFormatVersion: '2010-09-09'
Description: Stack 1 - Networking (VPC, subnets, IGW, security groups)

Resources:

  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: kafka-queue-vpc

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: kafka-queue-igw

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.0.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: kafka-queue-public

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: kafka-queue-public-rt

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRTAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - Key: Name
          Value: kafka-queue-private-a

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags:
        - Key: Name
          Value: kafka-queue-private-b

  PrivateSubnetC:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.3.0/24
      AvailabilityZone: !Select [2, !GetAZs ""]
      Tags:
        - Key: Name
          Value: kafka-queue-private-c

  BrokerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Kafka broker - PLAINTEXT 9092 from VPC
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 9092
          ToPort: 9092
          CidrIp: 10.0.0.0/16
          Description: Kafka PLAINTEXT from VPC
      Tags:
        - Key: Name
          Value: kafka-queue-broker-sg

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Lambda functions - egress to Kafka 9092 and HTTPS
      VpcId: !Ref VPC
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 9092
          ToPort: 9092
          CidrIp: 10.0.0.0/16
          Description: Kafka PLAINTEXT
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS for AWS APIs and VPC endpoints
      Tags:
        - Key: Name
          Value: kafka-queue-lambda-sg

  # Allow inbound 443 from VPC (VPC endpoint ENIs need this)
  LambdaSGIngressVPC:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref LambdaSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: 10.0.0.0/16
      Description: VPC endpoints HTTPS inbound

  # Self-referencing rule so Hyperplane ENIs can reach endpoint ENIs
  LambdaSGIngressSelf:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref LambdaSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !Ref LambdaSecurityGroup
      Description: Self - Hyperplane ENI to VPC endpoint ENI

  # VPC Interface Endpoints — all three are required for Queue mode ESM pollers:
  #   lambda  — pollers invoke the Lambda function
  #   sts     — pollers obtain temporary credentials
  #   sqs     — pollers write failed records to the OnFailure DLQ
  #
  # IMPORTANT: Missing the SQS endpoint causes a silent connection error —
  # the ESM stays Enabled/OK but Lambda stops being invoked after the first
  # batch when a failed record triggers a DLQ write.
  # Run scripts/setup-vpc-endpoints.sh to create all three endpoints.

Outputs:
  VpcId:
    Value: !Ref VPC
    Export:
      Name: kafka-queue-VpcId

  PublicSubnetId:
    Value: !Ref PublicSubnet
    Export:
      Name: kafka-queue-PublicSubnetId

  PrivateSubnetA:
    Value: !Ref PrivateSubnetA
    Export:
      Name: kafka-queue-PrivateSubnetA

  PrivateSubnetB:
    Value: !Ref PrivateSubnetB
    Export:
      Name: kafka-queue-PrivateSubnetB

  PrivateSubnetC:
    Value: !Ref PrivateSubnetC
    Export:
      Name: kafka-queue-PrivateSubnetC

  BrokerSecurityGroupId:
    Value: !Ref BrokerSecurityGroup
    Export:
      Name: kafka-queue-BrokerSecurityGroupId

  LambdaSecurityGroupId:
    Value: !Ref LambdaSecurityGroup
    Export:
      Name: kafka-queue-LambdaSecurityGroupId
