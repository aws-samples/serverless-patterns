AWSTemplateFormatVersion: '2010-09-09'
Description: KQD Stack 4 - CloudWatch alarms and dashboard for Queue mode ESM

Resources:

  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: kqd-alarms

  DlqDeliveryAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: kqd-dlq-delivery
      AlarmDescription: Records routed to DLQ (delivery attempts exhausted)
      Namespace: AWS/Lambda
      MetricName: OnFailureDestinationDeliveredEventCount
      Dimensions:
        - Name: FunctionName
          Value: !ImportValue kqd-WorkerFunctionName
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  LagGrowthAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: kqd-lag-growth
      AlarmDescription: Share group offset lag is growing
      Namespace: AWS/Lambda
      MetricName: MaxOffsetLag
      Dimensions:
        - Name: FunctionName
          Value: !ImportValue kqd-WorkerFunctionName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 1000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  PollerErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: kqd-poller-errors
      AlarmDescription: ESM reported polling errors
      Namespace: AWS/Lambda
      MetricName: PollingErrorCount
      Dimensions:
        - Name: FunctionName
          Value: !ImportValue kqd-WorkerFunctionName
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  KafkaQueueDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: kqd-KafkaQueue
      DashboardBody: !Sub
        - |
          {"widgets":[
            {"type":"metric","x":0,"y":0,"width":12,"height":6,"properties":{"title":"Offset Lag","region":"${AWS::Region}","view":"timeSeries","metrics":[["AWS/Lambda","SumOffsetLag","FunctionName","${Fn}"],["AWS/Lambda","MaxOffsetLag","FunctionName","${Fn}"]]}},
            {"type":"metric","x":12,"y":0,"width":12,"height":6,"properties":{"title":"Pollers","region":"${AWS::Region}","view":"timeSeries","metrics":[["AWS/Lambda","ProvisionedPollers","FunctionName","${Fn}"]]}},
            {"type":"metric","x":0,"y":6,"width":12,"height":6,"properties":{"title":"Event Counts","region":"${AWS::Region}","view":"timeSeries","metrics":[["AWS/Lambda","PolledEventCount","FunctionName","${Fn}"],["AWS/Lambda","InvokedEventCount","FunctionName","${Fn}"],["AWS/Lambda","AcknowledgedEventCount","FunctionName","${Fn}"],["AWS/Lambda","OnFailureDestinationDeliveredEventCount","FunctionName","${Fn}"]]}},
            {"type":"metric","x":12,"y":6,"width":12,"height":6,"properties":{"title":"Errors","region":"${AWS::Region}","view":"timeSeries","metrics":[["AWS/Lambda","PollingErrorCount","FunctionName","${Fn}"],["AWS/Lambda","InvokeErrorCount","FunctionName","${Fn}"]]}}
          ]}
        - Fn: !ImportValue kqd-WorkerFunctionName

Outputs:
  AlarmTopicArn:
    Value: !Ref AlarmTopic
    Export:
      Name: kqd-AlarmTopicArn
